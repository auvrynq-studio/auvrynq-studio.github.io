
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AUVRYNQ | Order Management</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #121212;
      --line: #303030;
      --text: #f1f1ed;
      --muted: #92928e;
      --accent: #b7b49a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .login {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .brand {
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 7px;
      margin-bottom: 14px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 48px;
    }
    .field {
      width: 100%;
      background: #171717;
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 17px;
      color: white;
      outline: none;
      margin-bottom: 14px;
    }
    .field:focus { border-color: var(--accent); }
    .primary {
      width: 100%;
      background: var(--accent);
      border: 0;
      padding: 17px;
      color: #111;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .error {
      color: #e2a3a3;
      font-size: 13px;
      margin-top: 16px;
      min-height: 20px;
    }
    .shell {
      max-width: 1240px;
      margin: auto;
      padding: 28px 20px 70px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 4px;
    }
    header p {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
    }
    .outline {
      background: transparent;
      border: 1px solid #555;
      color: white;
      padding: 11px 16px;
    }
    .heading {
      margin: 35px 0 22px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 22px;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 13px;
    }
    .stat strong {
      font-size: 30px;
      font-weight: 400;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin: 26px 0 18px;
    }
    .toolbar input {
      flex: 1;
      min-width: 0;
      margin: 0;
    }
    .toolbar button { min-width: 92px; }
    .notice {
      color: var(--muted);
      font-size: 13px;
      margin: 12px 0;
      min-height: 20px;
    }
    .orders {
      display: grid;
      gap: 14px;
    }
    .order {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 22px;
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 17px;
    }
    .order-number {
      font-size: 14px;
      overflow-wrap: anywhere;
      letter-spacing: 1px;
    }
    .date {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .price {
      color: var(--accent);
      white-space: nowrap;
      font-size: 17px;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 17px;
      margin: 20px 0;
    }
    .detail-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .detail-value {
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .order-bottom {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-select {
      background: #1c1c1c;
      border: 1px solid #555;
      color: white;
      padding: 12px;
      flex: 1;
      min-width: 0;
    }
    .save {
      background: var(--accent);
      border: 0;
      padding: 13px 22px;
      color: #111;
      font-weight: 700;
    }
    .save:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .empty {
      text-align: center;
      padding: 50px 15px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    footer {
      text-align: center;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      padding-top: 45px;
    }
    @media (max-width: 650px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .stat { padding: 17px; }
      .stat strong { font-size: 26px; }
      .brand { font-size: 25px; letter-spacing: 5px; }
      .details { gap: 15px; }
      .order { padding: 17px; }
      .order-bottom { flex-wrap: wrap; }
      .status-select { width: 100%; }
    }
  </style>
</head>
<body>

  <section id="loginPage" class="login">
    <div class="login-card">
      <div class="brand">AUVRYNQ</div>
      <div class="subtitle">PRIVATE MANAGEMENT SYSTEM</div>

      <form id="loginForm">
        <input
          id="password"
          class="field"
          type="password"
          placeholder="ADMIN PASSWORD / 管理員密碼"
          autocomplete="off"
          required
        >
        <button class="primary" type="submit">
          ENTER DASHBOARD
        </button>
      </form>

      <div id="loginError" class="error"></div>
      <p style="color:#666;font-size:11px;margin-top:35px">
        AUTHORIZED ACCESS ONLY
      </p>
    </div>
  </section>

  <main id="dashboard" class="shell hidden">
    <header>
      <div>
        <h1>AUVRYNQ</h1>
        <p>ORDER MANAGEMENT / 訂單管理</p>
      </div>
      <button id="logoutBtn" class="outline">登出</button>
    </header>

    <h2 class="heading">OVERVIEW / 訂單概況</h2>

    <section class="stats">
      <div class="stat">
        <span>全部訂單</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="stat">
        <span>待處理</span>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="stat">
        <span>已確認</span>
        <strong id="confirmedCount">0</strong>
      </div>
      <div class="stat">
        <span>已出貨</span>
        <strong id="shippedCount">0</strong>
      </div>
    </section>

    <h2 class="heading">ORDERS / 訂單列表</h2>

    <div class="toolbar">
      <input
        id="searchInput"
        class="field"
        type="search"
        placeholder="搜尋訂單、姓名、電話、商品"
      >
      <button id="refreshBtn" class="outline">重新整理</button>
    </div>

    <div id="notice" class="notice"></div>
    <section id="orderList" class="orders"></section>
<!-- AUVRYNQ 商品管理區域 -->
<section id="productManagement" class="orders">
  <h2>商品管理 PRODUCT MANAGEMENT</h2>
  <p>新增、編輯及管理 AUVRYNQ 商品</p>
  <form id="productForm" class="login-card" style="margin:24px 0;max-width:600px;">
  <h3>新增商品 ADD PRODUCT</h3>

  <label>商品編號 SKU</label>
  <input id="productSku" type="text" maxlength="100" required placeholder="例如 AV002">

  <label>商品名稱</label>
  <input id="productName" type="text" maxlength="200" required placeholder="例如 AUVRYNQ ESSENTIAL TEE">

  <label>商品價格 NT$</label>
  <input id="productPrice" type="number" min="0" step="1" required placeholder="例如 1280">

  <label>商品分類</label>
  <select id="productCategory">
    <option value="tops">上衣 TOPS</option>
    <option value="bottoms">褲裝 BOTTOMS</option>
    <option value="outerwear">外套 OUTERWEAR</option>
    <option value="accessories">配件 ACCESSORIES</option>
  </select>

  <label>商品尺寸（使用逗號分隔）</label>
  <input id="productSizes" type="text" placeholder="S,M,L,XL">

  <label>商品圖片網址</label>
  <input id="productImage" type="url" placeholder="https://...">

  <label>商品描述</label>
  <textarea id="productDescription" rows="4" maxlength="5000"></textarea>

  <label>上架狀態</label>
  <select id="productStatus">
    <option value="draft">草稿</option>
    <option value="active">正式上架</option>
    <option value="inactive">下架</option>
  </select>

  <button type="submit" class="save">儲存商品</button>
  <p id="productMessage" role="status"></p>
</form>
  <div id="productList"></div>
</section>
    <footer>AUVRYNQ © 2026 · PRIVATE SYSTEM</footer>
  </main>

  <script>
    "use strict";

    const API =
      "https://auvrynq-line-notify.pp0906865901.workers.dev";

    const STATUSES = {
      pending: "待處理",
      confirmed: "已確認",
      shipped: "已出貨",
      completed: "已完成",
      cancelled: "已取消"
    };

    let adminPassword = "";
    let orders = [];

    const $ = id => document.getElementById(id);

    function showLogin(message = "") {
      adminPassword = "";
      orders = [];
      $("password").value = "";
      $("loginError").textContent = message;
      $("dashboard").classList.add("hidden");
      $("loginPage").classList.remove("hidden");
      $("orderList").replaceChildren();
    }

    function showDashboard() {
      $("loginPage").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
    }

    function setNotice(message) {
      $("notice").textContent = message;
    }

    async function apiRequest(path, options = {}) {
      const headers = {
        "Authorization": "Bearer " + adminPassword,
        ...(options.body
          ? { "Content-Type": "application/json" }
          : {})
      };

      let response;

      try {
        response = await fetch(API + path, {
          ...options,
          headers,
          cache: "no-store"
        });
      } catch {
        throw new Error("網路連線失敗，請稍後重試");
      }

      if (response.status === 401) {
        throw new Error("管理員密碼錯誤或驗證失敗");
      }

      const data = await response.json().catch(() => null);

      if (!response.ok || !data || !data.success) {
        throw new Error(
          data?.error || "伺服器發生錯誤"
        );
      }

      return data;
    }

    async function loadOrders() {
      setNotice("正在讀取訂單...");

      const data = await apiRequest("/admin/orders");
      orders = Array.isArray(data.orders) ? data.orders : [];

      renderStats();
      renderOrders();
      setNotice("訂單已更新，顯示最新 " + orders.length + " 筆");
    }

    function renderStats() {
      $("totalCount").textContent = orders.length;
      $("pendingCount").textContent =
        orders.filter(o => o.status === "pending").length;
      $("confirmedCount").textContent =
        orders.filter(o => o.status === "confirmed").length;
      $("shippedCount").textContent =
        orders.filter(o => o.status === "shipped").length;
    }

    function addText(parent, className, value) {
      const el = document.createElement("div");
      el.className = className;
      el.textContent = value == null ? "" : String(value);
      parent.appendChild(el);
      return el;
    }

    function addDetail(container, label, value) {
      const item = document.createElement("div");
      addText(item, "detail-label", label);
      addText(item, "detail-value", value || "未提供");
      container.appendChild(item);
    }

    function renderOrders() {
      const keyword = $("searchInput").value
        .trim()
        .toLowerCase();

      const filtered = orders.filter(order => {
        const text = [
          order.order_number,
          order.customer_name,
          order.phone,
          order.email,
          order.product,
          order.address
        ].join(" ").toLowerCase();

        return text.includes(keyword);
      });

      const list = $("orderList");
      list.replaceChildren();

      if (!filtered.length) {
        addText(
          list,
          "empty",
          keyword ? "找不到符合的訂單" : "目前沒有訂單"
        );
        return;
      }

      for (const order of filtered) {
        const card = document.createElement("article");
        card.className = "order";

        const top = document.createElement("div");
        top.className = "order-top";

        const heading = document.createElement("div");
        addText(
          heading,
          "order-number",
          order.order_number
        );
        addText(
          heading,
          "date",
          order.created_at
  ? new Date(order.created_at.replace(" ", "T") + "Z")
      .toLocaleString("zh-TW", {
        timeZone: "Asia/Taipei",
        hour12: false
      })
  : ""
        );
        top.appendChild(heading);

        addText(
          top,
          "price",
          "NT$ " + Number(order.total || 0).toLocaleString("zh-TW")
        );
        card.appendChild(top);

        const details = document.createElement("div");
        details.className = "details";

        addDetail(details, "客戶姓名", order.customer_name);
        addDetail(details, "聯絡電話", order.phone);
        addDetail(details, "電子郵件", order.email);
        addDetail(details, "配送方式", order.shipping);
        addDetail(details, "商品資訊", order.product);
        addDetail(details, "配送地址", order.address);

        card.appendChild(details);

        const bottom = document.createElement("div");
        bottom.className = "order-bottom";

        const select = document.createElement("select");
        select.className = "status-select";

        for (const [value, label] of Object.entries(STATUSES)) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          select.appendChild(option);
        }

        select.value = order.status || "pending";
        bottom.appendChild(select);
const paymentSelect = document.createElement("select");
paymentSelect.className = "status-select";

const paymentOptions = {
  unpaid: "待付款",
  paid: "已確認入帳",
  refunded: "已退款"
};

for (const [value, label] of Object.entries(paymentOptions)) {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = label;
  paymentSelect.appendChild(option);
}

paymentSelect.value = order.payment_status || "unpaid";
bottom.appendChild(paymentSelect);
        const save = document.createElement("button");
        save.className = "save";
        save.textContent = "儲存狀態";

        save.addEventListener("click", async () => {
          const newStatus = select.value;

          if (newStatus === order.status) {
            setNotice("這筆訂單的狀態沒有變更");
            return;
          }

          save.disabled = true;
          save.textContent = "儲存中...";

          try {
            await apiRequest(
              "/admin/orders/" + encodeURIComponent(order.id) + "/status",
              {
                method: "PATCH",
                body: JSON.stringify({ status: newStatus })
              }
            );

            order.status = newStatus;
            renderStats();
            setNotice(
              "訂單 " + order.order_number + " 已更新為：" +
              STATUSES[newStatus]
            );
            save.textContent = "已儲存";
          } catch (error) {
            setNotice("更新失敗：" + error.message);
            select.value = order.status;
            save.textContent = "儲存狀態";
          } finally {
            save.disabled = false;
          }
        });

        bottom.appendChild(save);
        const paymentSave = document.createElement("button");
paymentSave.className = "save";
paymentSave.textContent = "儲存付款狀態";

paymentSave.addEventListener("click", async () => {
  const newPaymentStatus = paymentSelect.value;

  if (newPaymentStatus === order.payment_status) {
    setNotice("這筆訂單的付款狀態沒有變更");
    return;
  }

  if (newPaymentStatus === "paid" &&
      !confirm("請確認銀行款項已實際入帳，是否標記為已付款？")) {
    return;
  }

  paymentSave.disabled = true;
  paymentSave.textContent = "儲存中...";

  try {
    await apiRequest(
      "/admin/orders/" +
        encodeURIComponent(order.id) +
        "/payment-status",
      {
        method: "PATCH",
        body: JSON.stringify({
          payment_status: newPaymentStatus
        })
      }
    );

    order.payment_status = newPaymentStatus;
    paymentSave.textContent = "已儲存";
    setNotice("付款狀態已更新：" + paymentOptions[newPaymentStatus]);
  } catch (error) {
    paymentSelect.value = order.payment_status || "unpaid";
    paymentSave.textContent = "儲存付款狀態";
    setNotice("付款狀態更新失敗：" + error.message);
  } finally {
    paymentSave.disabled = false;
  }
});

bottom.appendChild(paymentSave);
const fulfillmentBox = document.createElement("div");
fulfillmentBox.style.cssText =
  "width:100%;display:grid;gap:10px;margin-top:16px;";

const fulfillmentFields = [
  {
    key: "fulfillment_mode",
    label: "出貨方式",
    options: {
      undecided: "尚未決定",
      supplier_direct: "批發商直寄顧客",
      self_ship: "自行轉寄顧客"
    }
  },
  {
    key: "procurement_status",
    label: "採購進度",
    options: {
      not_ordered: "尚未向批發商訂貨",
      ordered: "已向批發商訂貨",
      supplier_shipped: "批發商已寄出",
      received: "已收到商品",
      completed: "採購完成"
    }
  }
];

const fulfillmentInputs = {};

for (const field of fulfillmentFields) {
  const label = document.createElement("label");
  label.textContent = field.label;

  const select = document.createElement("select");
  select.className = "status-select";

  for (const [value, text] of Object.entries(field.options)) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = text;
    select.appendChild(option);
  }

  select.value = order[field.key] || Object.keys(field.options)[0];
  fulfillmentInputs[field.key] = select;

  fulfillmentBox.appendChild(label);
  fulfillmentBox.appendChild(select);
}

const trackingLabel = document.createElement("label");
trackingLabel.textContent = "物流單號";

const trackingInput = document.createElement("input");
trackingInput.type = "text";
trackingInput.placeholder = "輸入顧客包裹物流單號";
trackingInput.maxLength = 100;
trackingInput.value = order.tracking_number || "";
trackingInput.style.cssText =
  "width:100%;box-sizing:border-box;padding:12px;";

fulfillmentBox.appendChild(trackingLabel);
fulfillmentBox.appendChild(trackingInput);

const fulfillmentSave = document.createElement("button");
fulfillmentSave.className = "save";
fulfillmentSave.textContent = "儲存出貨資料";

fulfillmentSave.addEventListener("click", async () => {
  fulfillmentSave.disabled = true;
  fulfillmentSave.textContent = "儲存中...";

  const data = {
    fulfillment_mode: fulfillmentInputs.fulfillment_mode.value,
    procurement_status: fulfillmentInputs.procurement_status.value,
    tracking_number: trackingInput.value.trim()
  };

  try {
    await apiRequest(
      "/admin/orders/" +
        encodeURIComponent(order.id) +
        "/fulfillment",
      {
        method: "PATCH",
        body: JSON.stringify(data)
      }
    );

    Object.assign(order, data);
    fulfillmentSave.textContent = "已儲存";
    setNotice("出貨資料已更新");
  } catch (error) {
    fulfillmentSave.textContent = "儲存出貨資料";
    setNotice("出貨資料更新失敗：" + error.message);
  } finally {
    fulfillmentSave.disabled = false;
  }
});

fulfillmentBox.appendChild(fulfillmentSave);
bottom.appendChild(fulfillmentBox);
        card.appendChild(bottom);
        list.appendChild(card);
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const password = $("password").value;

      if (!password) return;

      adminPassword = password;
      $("loginError").textContent = "正在驗證...";

      try {
        const data = await apiRequest("/admin/orders");
        orders = Array.isArray(data.orders) ? data.orders : [];

        $("password").value = "";
        showDashboard();
        renderStats();
        renderOrders();
        await loadProducts();
        setNotice("登入成功，已載入訂單");
      } catch (error) {
        showLogin(error.message);
      }
    });

    $("logoutBtn").addEventListener("click", () => {
      showLogin();
    });

    $("refreshBtn").addEventListener("click", async () => {
      try {
        await loadOrders();
      } catch (error) {
        if (error.message.includes("驗證失敗")) {
          showLogin(error.message);
        } else {
          setNotice(error.message);
        }
      }
    });

    $("searchInput").addEventListener("input", renderOrders);

    window.addEventListener("pagehide", () => {
      adminPassword = "";
      orders = [];
    });
  // AUVRYNQ 商品管理：新增商品表單
$("productForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = $("productMessage");
  const button = $("productForm").querySelector('button[type="submit"]');

  const sizes = $("productSizes").value
    .split(",")
    .map(size => size.trim())
    .filter(Boolean);

  const product = {
    sku: $("productSku").value.trim(),
    name: $("productName").value.trim(),
    price: Number($("productPrice").value),
    category: $("productCategory").value,
    sizes,
    image_url: $("productImage").value.trim(),
    description: $("productDescription").value.trim(),
    status: $("productStatus").value
  };

  button.disabled = true;
  button.textContent = "儲存中...";
  message.textContent = "";

  try {
    const result = await apiRequest("/admin/products", {
      method: "POST",
      body: JSON.stringify(product)
    });

    message.textContent = "商品新增成功！編號：" + result.id;

    $("productForm").reset();
    await loadProducts();
  } catch (error) {
    message.textContent = "商品新增失敗：" + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "儲存商品";
  }
});

      container.textContent = "目前尚無商品";

    heading.textContent = "商品列表 PRODUCT LIST";

      card.style.cssText =
        "border:1px solid #333;padding:18px;margin:12px 0;";

      const title = document.createElement("h4");
      title.textContent = product.name;

      const details = document.createElement("p");
      details.textContent =
        "SKU：" + product.sku +
        "｜NT$ " + product.price +
        "｜狀態：" + product.status;

      card.appendChild(title);
card.appendChild(details);
