
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUVRYNQ | Official Store</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
    padding: 35px 20px;
    border-bottom: 1px solid #292929;
    letter-spacing: 8px;
    font-size: 22px;
    font-weight: 300;
}


main {
    padding: 130px 20px 90px;
}


h1 {
    font-size: clamp(38px, 9vw, 68px);
    font-weight: 300;
    letter-spacing: 8px;
    line-height: 1.3;
    margin: 0 0 30px;
}

p {
  color: #aaa;
  letter-spacing: 2px;
}
a {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 30px;
  border: 1px solid white;
  color: white;
  text-decoration: none;
}
section {
  padding: 60px 20px;
}
footer {
  padding: 30px;
  color: #888;
  font-size: 12px;
}
</style>
</head>
<body>
<header>AUVRYNQ</header>
<main>
  <p>INDEPENDENT FASHION LABEL</p>
  <h1>AUVRYNQ</h1>
  <p>DEFINED BY SILENCE.</p>
  <a href="#shop">EXPLORE COLLECTION</a>
</main>
<section id="shop">
  <h2>THE COLLECTION</h2>
  <p>Clothing & Accessories</p>
  
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:600px;margin:30px auto;padding:0 16px;">

 <a href="tops.html" style="color:white;text-decoration:none;border:1px solid #555;padding:35px 8px;">
TOPS
<br><small>上身服飾</small>
</a>

<a href="bottoms.html" style="color:white;text-decoration:none;border:1px solid #555;padding:35px 8px;">
BOTTOMS
<br><small>下身服飾</small>
</a>

<a href="outerwear.html" style="color:white;text-decoration:none;border:1px solid #555;padding:35px 8px;">
OUTERWEAR
<br><small>外套</small>
</a>

<a href="accessories.html" style="color:white;text-decoration:none;border:1px solid #555;padding:35px 8px;">
ACCESSORIES
<br><small>配件</small>
</a>

</div>

</section>
<!-- AUVRYNQ NEW ARRIVALS -->
<section id="new-arrivals" style="padding:60px 20px;">

  <h2>NEW ARRIVALS</h2>
  <p>最新上架商品</p>

  <div id="product-grid" style="
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    max-width:1000px;
    margin:30px auto;
  "></div>

  <p id="product-message">商品載入中...</p>

</section>

<script>
(async function () {

  const grid = document.getElementById("product-grid");
  const message = document.getElementById("product-message");

  try {

    const response = await fetch(
      "https://auvrynq-line-notify.pp0906865901.workers.dev/products"
    );

    if (!response.ok) {
      throw new Error("Product API error");
    }

    const data = await response.json();

    if (!data.success || !Array.isArray(data.products)) {
      throw new Error("Invalid product data");
    }

    if (data.products.length === 0) {
      message.textContent = "目前尚無上架商品";
      return;
    }

    message.textContent = "";

    data.products.forEach(product => {

      const card = document.createElement("article");
card.style.cursor = "pointer";

card.addEventListener("click", () => {
  window.location.href = "product.html?sku=" + encodeURIComponent(product.sku);
});
      card.style.cssText = `
        border:1px solid #333;
        padding:20px;
        background:#151515;
        text-align:left;
      `;

      if (
        product.image_url &&
        /^https:\/\//i.test(product.image_url)
      ) {

        const img = document.createElement("img");

        img.src = product.image_url;
        img.alt = product.name;
        img.loading = "lazy";

        img.style.cssText = `
          width:100%;
          height:260px;
          object-fit:cover;
        `;

        card.appendChild(img);

      }

      const name = document.createElement("h3");
      name.textContent = product.name;

      const price = document.createElement("p");
      price.textContent =
        "NT$ " + Number(product.price).toLocaleString("zh-TW");

      card.appendChild(name);
      card.appendChild(price);

      grid.appendChild(card);

    });

  } catch (error) {

    console.error("AUVRYNQ Product Error:", error);

    message.textContent = "商品暫時無法載入";

  }

})();
</script>  
<footer>
  AUVRYNQ © 2026
</footer>
</body>
</html>
