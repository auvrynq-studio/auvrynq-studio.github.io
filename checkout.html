<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>Checkout | AUVRYNQ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111;

}
header {
  text-align: center;
  padding: 30px 15px;
  font-size: 24px;
  letter-spacing: 6px;

}
main {
  max-width: 650px;

h2 {

}
label {

}

.note {

button {

  <option value="澎湖縣">澎湖縣</option>

<div id="store-fields">
  <label for="store">取貨門市名稱及地址</label>

</div>

<div id="home-fields" style="display:none;">

  
<label for="district">DISTRICT / 鄉鎮市區</label>
<select id="district">
  <option value="">請先選擇收件縣市</option>
</select>

  <label for="address">ADDRESS / 詳細地址</label>

<input id="customer" autocomplete="name" placeholder="請輸入姓名">

<label for="phone">手機號碼</label>

<label for="email">電子郵件</label>

</p>

<button type="button" onclick="placeOrder()">

function loadOrder() {
  let cart = [];
  try {
    const data = JSON.parse(
      localStorage.getItem("auvrynq_cart") || "[]"
    );
    if (Array.isArray(data)) cart = data;
  } catch {}

  const items = document.getElementById("order-items");
  let total = 0;

  if (cart.length === 0) {
    items.textContent = "購物車目前沒有商品";
  }

  cart.forEach(item => {
    const price = Number(item.price) || 0;
    const qty = Number(item.quantity) || 0;
    total += price * qty;

    const line = document.createElement("div");
    line.textContent =
      item.id + " / SIZE " + item.size +
      " / QTY " + qty +
      " / NT$" + (price * qty).toLocaleString("en-US");
    items.appendChild(line);
  });

  document.getElementById("subtotal").textContent =
    "NT$" + total.toLocaleString("en-US");
}

async function placeOrder() {
  const name = document.getElementById("customer").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!name || !phone || !email) {
    alert("請填寫收件人姓名、電話及電子郵件");
    return;
  }

  const cart = JSON.parse(localStorage.getItem("auvrynq_cart") || "[]");

  if (!cart.length) {
    alert("購物車是空的，請先選購商品");
    return;
  }

 const order = {
  name,
  phone,
  email,
  product: cart.map(item =>
    `${item.id} / SIZE ${item.size} / QTY ${item.quantity}`
  ).join(", "),
  total: cart.reduce((sum, item) =>
  sum + Number(item.price) * Number(item.quantity),
  0
),
shipping: ({
  home: "宅配到府",
  "7-11": "7-ELEVEN 超商取貨",
  family: "全家便利商店取貨"
})[document.getElementById("shipping").value]
  || document.getElementById("shipping").value,

address: [
  document.getElementById("county")?.value,
  document.getElementById("district")?.value,
  document.getElementById("address")?.value
].filter(Boolean).join("")
};

try {
  const response = await fetch(
    "https://auvrynq-line-notify.pp0906865901.workers.dev",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(order)
    }
  );

  if (!response.ok) {
    throw new Error("LINE 通知失敗");
  }

  
const result = await response.json();

if (!result.success || !result.orderNumber) {
  throw new Error("訂單回應缺少編號");
}

window.location.href =
  "order-success.html?orderNumber=" +
  encodeURIComponent(result.orderNumber);

} catch (error) {
  alert("訂單送出失敗，請稍後再試");
}

}
