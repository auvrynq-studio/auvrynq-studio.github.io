
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | AUVRYNQ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 30px 15px;
  font-size: 24px;
  letter-spacing: 6px;
  border-bottom: 1px solid #333;
}
main {
  max-width: 650px;
  margin: 40px auto;
  padding: 0 20px;
}
h1 { font-size: 21px; letter-spacing: 3px; }
h2 {
  margin-top: 35px;
  font-size: 15px;
  letter-spacing: 2px;
}
label {
  display: block;
  margin: 18px 0 8px;
  font-size: 13px;
}
input, select {
  width: 100%;
  padding: 14px;
  background: #1c1c1c;
  color: #fff;
  border: 1px solid #555;
  border-radius: 0;
  font-size: 14px;
}
.summary {
  border-top: 1px solid #444;
  border-bottom: 1px solid #444;
  padding: 20px 0;
  line-height: 2;
}
.total {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  margin-top: 20px;
}
.note {
  color: #aaa;
  font-size: 12px;
  line-height: 1.8;
}
button {
  width: 100%;
  padding: 17px;
  margin-top: 30px;
  background: #fff;
  color: #111;
  border: 0;
  letter-spacing: 2px;
  cursor: pointer;
}
.back {
  display: block;
  margin: 25px 0;
  color: #aaa;
  text-align: center;
  text-decoration: none;
  font-size: 12px;
}
</style>
</head>
<body>

<header>AUVRYNQ</header>

<main>
<h1>CHECKOUT</h1>

<h2>ORDER SUMMARY / 訂單摘要</h2>
<div class="summary">
  <div id="order-items"></div>
  <div class="total">
    <span>商品小計</span>
    <span id="subtotal">NT$0</span>
  </div>
  
<div class="total">
  <span>SHIPPING / 運費</span>
  <span id="shipping-fee">待計算</span>
</div>

<div class="total">
  <strong>TOTAL / 應付總額</strong>
  <strong id="grand-total">待計算</strong>
</div>

<p class="note" id="shipping-note">
  請選擇配送方式與收件縣市。
  運費確認前暫不開放下單。
</p>

</div>

<h2>SHIPPING / 配送方式</h2>
<label for="shipping">選擇配送方式</label>
<select id="shipping" onchange="updateShipping()">
  <option value="711">7-ELEVEN 超商取貨</option>
  <option value="family">全家超商取貨</option>
  <option value="home">宅配到府</option>
</select>

<label for="county">DELIVERY REGION / 收件縣市</label>
<select id="county" onchange="updateShipping()">
  <option value="">請選擇縣市</option>
  <option value="臺北市">臺北市</option>
  <option value="新北市">新北市</option>
  <option value="基隆市">基隆市</option>
  <option value="桃園市">桃園市</option>
  <option value="新竹市">新竹市</option>
  <option value="新竹縣">新竹縣</option>
  <option value="苗栗縣">苗栗縣</option>
  <option value="臺中市">臺中市</option>
  <option value="彰化縣">彰化縣</option>
  <option value="南投縣">南投縣</option>
  <option value="雲林縣">雲林縣</option>
  <option value="嘉義市">嘉義市</option>
  <option value="嘉義縣">嘉義縣</option>
  <option value="臺南市">臺南市</option>
  <option value="高雄市">高雄市</option>
  <option value="屏東縣">屏東縣</option>
  <option value="宜蘭縣">宜蘭縣</option>
  <option value="花蓮縣">花蓮縣</option>
  <option value="臺東縣">臺東縣</option>
  <option value="澎湖縣">澎湖縣</option>
  <option value="金門縣">金門縣</option>
  <option value="連江縣">連江縣</option>
</select>

<div id="store-fields">
  <label for="store">取貨門市名稱及地址</label>
  <input id="store" placeholder="例如：XX門市，完整地址">
</div>

<div id="home-fields" style="display:none;">

  
<label for="district">DISTRICT / 鄉鎮市區</label>
<select id="district">
  <option value="">請先選擇收件縣市</option>
</select>

  <label for="address">ADDRESS / 詳細地址</label>
  <input
    id="address"
    placeholder="路、街、巷、弄、號、樓層"
    autocomplete="street-address"
  >

</div>




<h2>CONTACT / 收件資料</h2>
<label for="customer">收件人姓名</label>
<input id="customer" autocomplete="name" placeholder="請輸入姓名">

<label for="phone">手機號碼</label>
<input id="phone" type="tel" autocomplete="tel" placeholder="09XXXXXXXX">

<label for="email">電子郵件</label>
<input id="email" type="email" autocomplete="email" placeholder="example@email.com">

<h2>PAYMENT / 付款方式</h2>
<p>銀行轉帳 BANK TRANSFER</p>
<p class="note">
  正式接單功能尚未開放。
  後續將提供銀行資訊及安全的訂單提交方式。
</p>

<button type="button" disabled>
  PLACE ORDER / 尚未開放下單
</button>

<a class="back" href="cart.html">
  BACK TO CART
</a>
</main>

<script>

function updateShipping() {
  const shipping = document.getElementById("shipping").value;
  const county = document.getElementById("county").value;
  
  const districtSelect = document.getElementById("district");

  const districts = {
  "臺北市": [

  "中正區", "大同區", "中山區", "松山區",
  "大安區", "萬華區", "信義區", "士林區",
  "北投區", "內湖區", "南港區", "文山區"
],

   
    "新竹縣": [
      "竹東鎮", "竹北市", "湖口鄉", "新豐鄉",
      "新埔鎮", "關西鎮", "芎林鄉", "橫山鄉",
      "北埔鄉", "寶山鄉", "峨眉鄉",
      "尖石鄉", "五峰鄉"
    ],
 "新北市": [
  "板橋區", "三重區", "中和區", "永和區",
  "新莊區", "新店區", "土城區", "蘆洲區",
  "樹林區", "汐止區", "鶯歌區", "三峽區",
  "淡水區", "瑞芳區", "五股區", "泰山區",
  "林口區", "八里區", "深坑區", "石碇區",
  "坪林區", "三芝區", "石門區", "金山區",
  "萬里區", "平溪區", "雙溪區", "貢寮區",
  "烏來區"
  ],
"桃園市": [
  "桃園區", "中壢區", "平鎮區", "八德區",
  "楊梅區", "蘆竹區", "大溪區", "龍潭區",
  "龜山區", "大園區", "觀音區", "新屋區",
  "復興區"
]
};

  const previousDistrict = districtSelect.value;
  districtSelect.innerHTML =
    '<option value="">請選擇鄉鎮市區</option>';

  (districts[county] || []).forEach(district => {
    const option = document.createElement("option");
    option.value = district;
    option.textContent = district;
    districtSelect.appendChild(option);
  });

  if (districts[county]?.includes(previousDistrict)) {
    districtSelect.value = previousDistrict;
  }


  document.getElementById("store-fields").style.display =
    shipping === "home" ? "none" : "block";

  document.getElementById("home-fields").style.display =
    shipping === "home" ? "block" : "none";

  const feeDisplay = document.getElementById("shipping-fee");
  const totalDisplay = document.getElementById("grand-total");
  const note = document.getElementById("shipping-note");

  feeDisplay.textContent = "待確認";
  totalDisplay.textContent = "待確認";

  if (!county) {
    note.textContent = "請先選擇收件縣市。";
    return;
  }

  const islands = ["澎湖縣", "金門縣", "連江縣"];

  if (islands.includes(county)) {
    note.textContent = "離島運費與配送範圍需人工確認。";
    return;
  }

  const shippingFees = {
    "711": 60,
    "family": 60,
    "home": 89
  };

  const fee = shippingFees[shipping];
  const subtotal = Number(
    document.getElementById("subtotal")
      .textContent.replace(/[^0-9]/g, "")
  ) || 0;

  if (subtotal <= 0 || fee === undefined) {
    note.textContent = "請先確認購物車商品與配送方式。";
    return;
  }

  feeDisplay.textContent = "NT$" + fee;
  totalDisplay.textContent =
    "NT$" + (subtotal + fee).toLocaleString("en-US");

  note.textContent =
    "目前為測試運費，正式出貨前須確認物流費率、包裹規格與配送限制。";
}


function loadOrder() {
  let cart = [];
  try {
    const data = JSON.parse(
      localStorage.getItem("auvrynq_cart") || "[]"
    );
    if (Array.isArray(data)) cart = data;
  } catch {}

  const items = document.getElementById("order-items");
  let total = 0;

  if (cart.length === 0) {
    items.textContent = "購物車目前沒有商品";
  }

  cart.forEach(item => {
    const price = Number(item.price) || 0;
    const qty = Number(item.quantity) || 0;
    total += price * qty;

    const line = document.createElement("div");
    line.textContent =
      item.id + " / SIZE " + item.size +
      " / QTY " + qty +
      " / NT$" + (price * qty).toLocaleString("en-US");
    items.appendChild(line);
  });

  document.getElementById("subtotal").textContent =
    "NT$" + total.toLocaleString("en-US");
}

loadOrder();
updateShipping();
</script>
</body>
</html>
