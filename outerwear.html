
<!DOCTYPE html>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 35px 20px;
  border-bottom: 1px solid #444;
  font-size: 24px;
  letter-spacing: 6px;
}

main {
  padding: 90px 20px 50px;
}

.label {
  color: #999;
  letter-spacing: 5px;
  font-size: 12px;
}

h1 {
  font-size: clamp(32px, 8vw, 48px);
  letter-spacing: 5px;
  margin: 35px 0;
}

.subtitle {
  color: #aaa;
  font-size: 15px;
  line-height: 2;
}

.collection {

  padding: 55px 20px;
  margin: 90px auto 50px;
  max-width: 600px;
  color: #aaa;
  letter-spacing: 5px;
}

  text-decoration: none;

}

footer {
  padding: 80px 20px 30px;
  color: #777;
  font-size: 12px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  text-align: left;
}

.product-card {
  min-width: 0;
}

.product-image {
  aspect-ratio: 3 / 4;
  background: #1b1b1b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: 10px;
  letter-spacing: 1px;
  text-align: center;
}

.product-info {
  padding: 20px 0;
}

.product-info p {
  color: #888;
  font-size: 10px;
  letter-spacing: 2px;
}

.product-info h3 {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 1px;
}

.product-info span {
  color: #aaa;
  font-size: 12px;
}

</head>
<body>

<header>AUVRYNQ</header>

</div>

  

  <a class="back" href="index.html">

<footer>AUVRYNQ © 2026</footer>
